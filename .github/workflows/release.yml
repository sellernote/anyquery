# Publishes a release to the VS Code Marketplace and Open VSX, and attaches the .vsix to a GitHub release.
# Runs when a vX.Y.Z tag is pushed. To publish an existing tag again, run it by hand with that tag.
# The Marketplace trusts this workflow through a Trusted Publishing policy, so it needs no token.
# Open VSX needs the repository secret OVSX_PAT.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, such as v0.3.0
        required: true

concurrency: release

permissions:
  contents: write
  id-token: write # lets vsce sign in to the Marketplace with Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the Open VSX token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: '[ -n "$OVSX_PAT" ] || { echo "::error::Add the OVSX_PAT repository secret (Open VSX token)"; exit 1; }'

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag $TAG does not match version $VERSION in package.json"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package

      # --skip-duplicate makes a rerun safe after only one of them succeeded.
      # vsce is pinned here, not taken from the tag, because --oidc needs 4.1.0 or later.
      - name: Publish to the VS Code Marketplace
        run: pnpm dlx @vscode/vsce@4.1.0 publish --oidc --packagePath "anyquery-$VERSION.vsix" --skip-duplicate

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm dlx ovsx@1.4.0 publish "anyquery-$VERSION.vsix" --pat "$OVSX_PAT" --skip-duplicate

      - name: Attach the .vsix to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" "anyquery-$VERSION.vsix" --clobber
